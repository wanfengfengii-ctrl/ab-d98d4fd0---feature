# 历史帆船主帆修补 · 帆布联合排版工作台
#
# 常驻 Web 服务：
#   docker compose up web --build
#   宿主机端口通过环境变量 WEB_PORT 配置（默认 8080）：
#     WEB_PORT=9090 docker compose up web
#
# 一次性校验服务（跑完自行退出，退出码报告结果）：
#   docker compose run --rm verify
#   或：docker compose up --build --abort-on-container-exit --exit-code-from verify
services:
  web:
    build:
      context: .
    image: sails-canvas-workbench:latest
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
    ports:
      # 宿主机端口可配置：${WEB_PORT:-8080} -> 容器 8080
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped

  # 一次性服务：代码测试 + 前端构建 + 候选冲突业务冒烟。
  # 退出码 0 全部通过；非 0 存在失败。置于 verify profile，不随 web 常驻启动，
  # 用 `docker compose run --rm verify` 显式运行。
  verify:
    profiles: ["verify"]
    build:
      context: .
    image: sails-canvas-workbench:latest
    command: ["node", "src/server/verify.js"]
    environment:
      NODE_ENV: "development"
    restart: "no"
